# Render Blueprint — Git 저장소를 연결하면 웹 서비스가 이 설정으로 올라갑니다.
# 폴더를 드래그해서 올리지 마세요. node_modules 는 서버가 직접 설치합니다.
services:
  - type: web
    name: kis-scanner
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
